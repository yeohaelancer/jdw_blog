# =====================================================================
# nginx.conf 샘플
# - 프론트엔드 빌드 결과(dist)를 정적 파일로 서빙
# - /api 요청은 백엔드(Spring Boot)로 리버스 프록시
#
# 사용법:
# 1) frontend 에서 `npm run build` 실행 -> frontend/dist 생성
# 2) 아래 root 경로를 frontend/dist 절대경로로 수정
# 3) 이 파일을 nginx.conf(또는 conf.d/base.conf)로 등록 후 nginx 재시작
# =====================================================================

server {
    listen       80;
    server_name  localhost;   # 실제 도메인으로 교체

    # gzip 압축
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # -------------------------------------------------------------
    # 프론트엔드 정적 파일 (Vue.js 빌드 결과물)
    # -------------------------------------------------------------
    root   /path/to/frontend/dist;   # TODO: 실제 배포 경로로 수정
    index  index.html;

    location / {
        try_files $uri $uri/ /index.html;   # Vue Router history mode 대응
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # -------------------------------------------------------------
    # 백엔드 API 리버스 프록시 (Spring Boot, 기본 8080 포트)
    # -------------------------------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
    }

    # 업로드 파일 용량 제한 (필요시 조정)
    client_max_body_size 20m;

    # 에러 페이지
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
